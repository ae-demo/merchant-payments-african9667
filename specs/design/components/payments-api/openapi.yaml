openapi: 3.0.3
info:
  title: Payments API
  version: 0.1.0
  description: Merchant onboarding, payment links, transactions, payouts and disputes.
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            merchants:read: The caller's own merchant profile
            merchants:update: Update the caller's own business and bank details
            merchants:read-all: Every merchant
            merchants:review: Approve or reject a merchant's onboarding
            merchants:suspend: Suspend or reactivate a merchant
            payment-links:create: Create a payment link
            payment-links:read: The caller's own payment links
            transactions:read: The caller's own transactions
            transactions:read-all: Every transaction
            payouts:read: The caller's own payouts
            payouts:request: Request an on-demand payout
            disputes:read-all: Every dispute
            disputes:resolve: Resolve a dispute
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    BankAccount:
      type: object
      required: [accountName, accountNumber, bankName]
      properties:
        accountName: { type: string }
        accountNumber: { type: string }
        bankName: { type: string }
    Merchant:
      type: object
      required: [id, businessName, registrationNumber, country, currency, status]
      properties:
        id: { type: string }
        businessName: { type: string }
        registrationNumber: { type: string }
        country: { type: string, enum: [NG, KE, GH] }
        currency: { type: string, enum: [NGN, KES, GHS] }
        status: { type: string, enum: [pending, approved, rejected, suspended] }
        bankAccount: { $ref: '#/components/schemas/BankAccount' }
        createdAt: { type: string, format: date-time }
    MerchantInput:
      type: object
      required: [businessName, registrationNumber, country, currency, bankAccount]
      properties:
        businessName: { type: string }
        registrationNumber: { type: string }
        country: { type: string, enum: [NG, KE, GH] }
        currency: { type: string, enum: [NGN, KES, GHS] }
        bankAccount: { $ref: '#/components/schemas/BankAccount' }
    MerchantReview:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        reason: { type: string }
    PaymentLink:
      type: object
      required: [id, merchantId, amount, currency, status, createdAt]
      properties:
        id: { type: string }
        merchantId: { type: string }
        amount: { type: number, format: double }
        currency: { type: string, enum: [NGN, KES, GHS] }
        description: { type: string }
        status: { type: string, enum: [open, paid, expired] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
    PaymentLinkInput:
      type: object
      required: [amount, currency, description]
      properties:
        amount: { type: number, format: double }
        currency: { type: string, enum: [NGN, KES, GHS] }
        description: { type: string }
    PaymentLinkPublic:
      type: object
      required: [id, merchantName, amount, currency, status]
      properties:
        id: { type: string }
        merchantName: { type: string }
        amount: { type: number, format: double }
        currency: { type: string, enum: [NGN, KES, GHS] }
        description: { type: string }
        status: { type: string, enum: [open, paid, expired] }
    PaymentRequest:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [mobile_money, card] }
        phoneNumber: { type: string, description: required for mobile_money }
        cardToken: { type: string, description: required for card }
    Transaction:
      type: object
      required: [id, paymentLinkId, merchantId, method, amount, currency, status, createdAt]
      properties:
        id: { type: string }
        paymentLinkId: { type: string }
        merchantId: { type: string }
        method: { type: string, enum: [mobile_money, card] }
        amount: { type: number, format: double }
        currency: { type: string, enum: [NGN, KES, GHS] }
        status: { type: string, enum: [pending, completed, failed, disputed, refunded] }
        providerReference: { type: string }
        createdAt: { type: string, format: date-time }
    Payout:
      type: object
      required: [id, merchantId, amount, currency, type, status]
      properties:
        id: { type: string }
        merchantId: { type: string }
        amount: { type: number, format: double }
        currency: { type: string, enum: [NGN, KES, GHS] }
        type: { type: string, enum: [automatic, manual] }
        status: { type: string, enum: [pending, completed, failed] }
        scheduledAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
    Dispute:
      type: object
      required: [id, transactionId, reason, amount, status, createdAt]
      properties:
        id: { type: string }
        transactionId: { type: string }
        reason: { type: string }
        amount: { type: number, format: double }
        status: { type: string, enum: [open, resolved-merchant, resolved-customer] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
    DisputeResolution:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [resolved-merchant, resolved-customer] }
        notes: { type: string }
security:
  - oauth2: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is healthy
  /me/merchant:
    post:
      operationId: createMyMerchant
      summary: Submit a new merchant business profile for review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantInput' }
      responses:
        '201':
          description: Profile created, pending review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: getMyMerchant
      summary: The caller's own merchant profile
      security:
        - oauth2: [merchants:read]
      responses:
        '200':
          description: The merchant profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '404':
          description: No profile yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateMyMerchant
      summary: Update the caller's own business and bank details
      security:
        - oauth2: [merchants:update]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantInput' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No profile yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /merchants:
    get:
      operationId: listMerchants
      summary: Every merchant
      security:
        - oauth2: [merchants:read-all]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, suspended] }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Matching merchants
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/Merchant' } }
  /merchants/{merchantId}:
    get:
      operationId: getMerchant
      summary: Every merchant — detail view
      security:
        - oauth2: [merchants:read-all]
      parameters:
        - name: merchantId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The merchant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '404':
          description: No such merchant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /merchants/{merchantId}/review:
    post:
      operationId: reviewMerchant
      summary: Approve or reject a merchant's onboarding submission
      security:
        - oauth2: [merchants:review]
      parameters:
        - name: merchantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantReview' }
      responses:
        '200':
          description: Review recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '404':
          description: No such merchant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /merchants/{merchantId}/suspend:
    post:
      operationId: suspendMerchant
      summary: Suspend or reactivate a merchant
      security:
        - oauth2: [merchants:suspend]
      parameters:
        - name: merchantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended: { type: boolean }
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '404':
          description: No such merchant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/payment-links:
    get:
      operationId: listMyPaymentLinks
      summary: The caller's own payment links
      security:
        - oauth2: [payment-links:read]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, paid, expired] }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Matching payment links
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/PaymentLink' } }
    post:
      operationId: createPaymentLink
      summary: Create a payment link
      security:
        - oauth2: [payment-links:create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentLinkInput' }
      responses:
        '201':
          description: Payment link created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentLink' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /payment-links/{linkId}:
    get:
      operationId: getPublicPaymentLink
      summary: A payment link's public details for the paying customer
      security: []
      parameters:
        - name: linkId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Amount and merchant to display on checkout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentLinkPublic' }
        '404':
          description: No such payment link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /payment-links/{linkId}/pay:
    post:
      operationId: payPaymentLink
      summary: Pay a payment link via mobile money or card
      security: []
      parameters:
        - name: linkId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRequest' }
      responses:
        '202':
          description: Payment submitted for processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400':
          description: Invalid payment request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such payment link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/transactions:
    get:
      operationId: listMyTransactions
      summary: The caller's own transactions
      security:
        - oauth2: [transactions:read]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, completed, failed, disputed, refunded] }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Matching transactions
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
  /transactions:
    get:
      operationId: listAllTransactions
      summary: Every transaction
      security:
        - oauth2: [transactions:read-all]
      parameters:
        - name: merchantId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pending, completed, failed, disputed, refunded] }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Matching transactions
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
  /me/payouts:
    get:
      operationId: listMyPayouts
      summary: The caller's own payouts
      security:
        - oauth2: [payouts:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Matching payouts
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/Payout' } }
    post:
      operationId: requestPayout
      summary: Request an on-demand payout
      security:
        - oauth2: [payouts:request]
      responses:
        '201':
          description: Payout requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '400':
          description: Insufficient balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /disputes:
    get:
      operationId: listDisputes
      summary: Every dispute
      security:
        - oauth2: [disputes:read-all]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved-merchant, resolved-customer] }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Matching disputes
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/Dispute' } }
  /disputes/{disputeId}/resolve:
    post:
      operationId: resolveDispute
      summary: Resolve a dispute in favor of the merchant or the customer
      security:
        - oauth2: [disputes:resolve]
      parameters:
        - name: disputeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisputeResolution' }
      responses:
        '200':
          description: Dispute resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '404':
          description: No such dispute
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
